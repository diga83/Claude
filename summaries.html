<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Summaries — IGCSE ICT 4IT1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B3A6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
.summary-controls { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; }
.chap-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.85rem; }
.chap-chip {
  padding: 0.4rem 0.85rem; background: var(--surface-2); border: 1.5px solid var(--border);
  border-radius: 100px; font-size: 0.85rem; cursor: pointer; font-weight: 500;
}
.chap-chip.active { background: var(--blue); color: white; border-color: var(--blue); }

.summary-doc {
  background: white; color: black; padding: 2rem 2.5rem; border-radius: var(--radius);
  border: 1px solid var(--border); margin-top: 1.5rem;
  font-family: 'Inter', sans-serif; line-height: 1.55;
}
[data-theme="dark"] .summary-doc { background: white; color: black; }
.summary-doc h1, .summary-doc h2, .summary-doc h3 { color: black; font-family: 'Fraunces', serif; }
.summary-doc h1 { font-size: 1.7rem; border-bottom: 3px solid #1B3A6B; padding-bottom: 0.5rem; margin-bottom: 0.5rem; }
.summary-doc h2.ch-title { font-size: 1.4rem; margin-top: 2rem; margin-bottom: 0.5rem; background: #1B3A6B; color: white !important; padding: 0.5rem 1rem; border-radius: 6px; page-break-after: avoid; }
.summary-doc h3 { font-size: 1.1rem; margin-top: 1.2rem; margin-bottom: 0.4rem; color: #1B3A6B; }
.summary-doc ul { padding-left: 1.4rem; margin: 0.4rem 0 1rem; }
.summary-doc li { margin-bottom: 0.35rem; font-size: 0.92rem; }
.summary-doc .doc-meta { font-size: 0.85rem; color: #555; margin-bottom: 1.5rem; }
.summary-doc .terms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.4rem 1rem; margin-bottom: 1rem; }
.summary-doc .term-item { font-size: 0.82rem; }
.summary-doc .term-item strong { color: #1B3A6B; }
.summary-doc .key-tip { background: #FEF3C7; border-left: 3px solid #B45309; padding: 0.6rem 0.85rem; margin: 0.5rem 0; font-size: 0.88rem; border-radius: 0 4px 4px 0; }
.summary-doc .topic-block { page-break-inside: avoid; margin-bottom: 1.5rem; }

@media print {
  body { background: white !important; }
  .topbar, .sidebar, .backdrop, #pomodoroWidget, #notesWidget, .summary-controls, .no-print { display: none !important; }
  .app { grid-template-columns: 1fr !important; margin-top: 0 !important; }
  .main { padding: 0 !important; max-width: 100% !important; }
  .summary-doc { box-shadow: none; border: none; padding: 0; }
  @page { margin: 18mm; size: A4 portrait; }
  h2.ch-title { page-break-before: always; }
  h2.ch-title:first-of-type { page-break-before: auto; }
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main fade-in">
    <div class="quiz-hero no-print" style="background: linear-gradient(135deg, #475569 0%, #1B3A6B 100%);">
      <span class="hero-tag">Print &amp; revise</span>
      <h1>📄 Chapter summaries</h1>
      <p>One-page summaries of each chapter — key points, key terms, exam tips. Stick on the wall or print as a revision pack. Optimised for A4 printing.</p>
    </div>

    <div class="summary-controls no-print">
      <label style="font-size:0.78rem; color:var(--mid); font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Chapters to include</label>
      <div class="chap-chips" id="chapChips" style="margin-top:0.4rem;"></div>
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="generate()">📄 Generate summary</button>
        <button class="btn" onclick="window.print()" id="printBtn" style="display:none;">🖨 Print</button>
      </div>
    </div>

    <div id="summaryOutput"></div>
  </main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/search-index.js"></script>
<script src="assets/js/streaks.js"></script>
<script src="assets/js/app.js"></script>
<script>
let selected = new Set(CHAPTERS.map(c => c.id));

function renderChips() {
  document.getElementById('chapChips').innerHTML =
    `<div class="chap-chip ${selected.size === CHAPTERS.length ? 'active' : ''}" onclick="toggleAll()">All chapters</div>` +
    CHAPTERS.map(c => `<div class="chap-chip ${selected.has(c.id) ? 'active' : ''}" onclick="toggleCh(${c.id})">Ch ${c.id}: ${c.title}</div>`).join('');
}

function toggleAll() {
  if (selected.size === CHAPTERS.length) selected = new Set();
  else selected = new Set(CHAPTERS.map(c => c.id));
  renderChips();
}

function toggleCh(id) {
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  renderChips();
}

function summariseChapter(ch) {
  // Pull from search index if available
  const data = (typeof CHAPTER_SEARCH_INDEX !== 'undefined') ? CHAPTER_SEARCH_INDEX.find(c => c.id === ch.id) : null;
  // Pull glossary terms for this chapter
  const terms = (typeof GLOSSARY !== 'undefined') ? GLOSSARY.filter(g => g.ch === ch.id) : [];
  // Pull sections / key topics from search index
  const sections = data?.sections || [];
  // Build content
  const sectionList = sections.slice(0, 8).map(s => `<li>${s.title}</li>`).join('');
  const termList = terms.slice(0, 12).map(t => `<div class="term-item"><strong>${t.t}:</strong> ${t.d.substring(0, 80)}${t.d.length > 80 ? '…' : ''}</div>`).join('');

  return `
    <div class="topic-block">
      <h2 class="ch-title" style="background:${ch.color};">Chapter ${ch.id}: ${ch.title}</h2>
      <p style="color:#555; font-size:0.88rem; margin-bottom:1rem;"><strong>Paper ${ch.paper} · Spec ${ch.spec} · ${ch.sections} sections</strong></p>
      <p style="font-size:0.95rem; margin-bottom:1rem;">${ch.summary || ''}</p>

      ${sections.length > 0 ? `
        <h3>📌 Key topics</h3>
        <ul>${sectionList}</ul>
      ` : ''}

      ${terms.length > 0 ? `
        <h3>📖 Key terms (${terms.length})</h3>
        <div class="terms-grid">${termList}</div>
      ` : ''}

      <div class="key-tip">
        💡 <strong>Exam tip:</strong> Read this chapter actively. After reading, try the chapter MCQs — aim for 70%+ before moving on. Use the interactive diagrams page to visualise key concepts.
      </div>
    </div>
  `;
}

function generate() {
  if (selected.size === 0) { alert('Please select at least one chapter.'); return; }
  const ids = [...selected].sort((a, b) => a - b);
  const profile = (typeof getProfile === 'function') ? getProfile() : null;
  const name = profile?.name ? `<p class="doc-meta"><strong>${profile.name}</strong> · ${new Date().toLocaleDateString()}</p>` : '';
  const content = `
    <div class="summary-doc">
      <h1>IGCSE ICT 4IT1 — Chapter Summaries</h1>
      ${name}
      ${ids.map(id => summariseChapter(CHAPTERS.find(c => c.id === id))).join('')}
    </div>
  `;
  document.getElementById('summaryOutput').innerHTML = content;
  document.getElementById('printBtn').style.display = 'inline-flex';
  setTimeout(() => document.getElementById('summaryOutput').scrollIntoView({ behavior: 'smooth' }), 100);
}

document.addEventListener('DOMContentLoaded', renderChips);
</script>
</body>
</html>
