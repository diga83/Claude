<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Diagrams — GCSE Computer Science 1CP2</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#064E3B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
/* ───── Hub view ───── */
.diagram-hub {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.diagram-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.4rem;
  cursor: pointer;
  transition: all 0.2s;
  border-left: 4px solid var(--ch-color, var(--blue));
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.diagram-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.diagram-card .icon { font-size: 2rem; margin-bottom: 0.4rem; }
.diagram-card h4 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; margin: 0; }
.diagram-card .meta { font-size: 0.72rem; color: var(--mid); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.diagram-card p { font-size: 0.9rem; color: var(--text-mid); line-height: 1.5; margin: 0; }
.diagram-type-tag {
  display: inline-block;
  padding: 0.2rem 0.6rem;
  background: var(--surface-2);
  border-radius: 100px;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text-mid);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-top: 0.4rem;
  align-self: flex-start;
}

/* ───── Back button (top & bottom) ───── */
.diagram-back-bar {
  margin-bottom: 0.85rem;
}
.diagram-footer-bar {
  padding: 1.25rem 1.5rem;
  background: var(--surface-2);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: center;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.55rem 1.1rem;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.back-btn:hover {
  border-color: var(--blue);
  background: var(--blue);
  color: white;
  transform: translateX(-2px);
}
.back-btn span { transition: transform 0.15s; }
.back-btn:hover span { transform: translateX(-3px); }

/* ───── Viewer shell ───── */
.diagram-viewer {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-top: 1.5rem;
  overflow: hidden;
}
.diagram-viewer-header {
  padding: 1.25rem 1.5rem;
  background: linear-gradient(135deg, var(--ch-color, #1D4ED8) 0%, var(--ch-light, #6D28D9) 100%);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.diagram-viewer-header h2 { font-family: var(--font-display); margin: 0; font-size: 1.4rem; }
.diagram-viewer-header .close { background: rgba(255,255,255,0.2); border: none; color: white; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; }
.diagram-viewer-header .close:hover { background: rgba(255,255,255,0.3); }

/* ───── Two-pane layout (used by concept explorers) ───── */
.two-pane {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 0;
}
.two-pane .svg-area {
  background: var(--surface-2);
  padding: 1.5rem;
  display: grid;
  place-items: center;
  min-height: 500px;
  position: relative;
}
.two-pane .info-area {
  padding: 1.5rem;
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  max-height: 700px;
}
@media (max-width: 800px) {
  .two-pane { grid-template-columns: 1fr; }
  .two-pane .info-area { border-left: none; border-top: 1px solid var(--border); }
}

.interactive-svg { width: 100%; height: auto; max-width: 540px; }
.dev { cursor: pointer; transition: transform 0.15s; }
.dev:hover { transform: scale(1.08); transform-origin: center; }
.dev.selected .device-body { stroke: var(--blue) !important; stroke-width: 4 !important; }
.connection { stroke: #94A3B8; stroke-width: 2; fill: none; }
.connection.active { stroke: var(--blue); stroke-width: 3; stroke-dasharray: 5,3; animation: dashFlow 1s linear infinite; }
@keyframes dashFlow { to { stroke-dashoffset: -16; } }

/* ───── Tabs (for multi-variant diagrams) ───── */
.diag-tabs {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  padding: 0.85rem 1.5rem;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}
.diag-tab {
  padding: 0.5rem 1rem;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 100px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-mid);
  transition: all 0.15s;
}
.diag-tab:hover { border-color: var(--blue); }
.diag-tab.active { background: var(--blue); color: white; border-color: var(--blue); }

/* ───── Info panel shared styles ───── */
.info-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; margin-bottom: 0.75rem; }
.info-section { margin-bottom: 1.25rem; }
.info-section h4 { font-family: var(--font-body); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid); font-weight: 700; margin-bottom: 0.45rem; }
.info-section ul { padding-left: 1.2rem; margin: 0; }
.info-section li { margin-bottom: 0.35rem; line-height: 1.5; font-size: 0.92rem; }
.pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.pros-box, .cons-box { padding: 0.85rem; border-radius: 8px; font-size: 0.85rem; }
.pros-box { background: var(--green-light); border-left: 3px solid var(--green); }
.cons-box { background: #FEE2E2; border-left: 3px solid var(--red); }
[data-theme="dark"] .pros-box { background: rgba(34,197,94,0.1); }
[data-theme="dark"] .cons-box { background: rgba(239,68,68,0.1); }
.pros-box strong, .cons-box strong { display: block; margin-bottom: 0.3rem; font-size: 0.78rem; }
.pros-box ul, .cons-box ul { padding-left: 1rem; margin: 0; }
.pros-box li, .cons-box li { font-size: 0.82rem; line-height: 1.4; }
.example-scenario { background: var(--blue-light); border-left: 4px solid var(--blue); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; line-height: 1.55; margin-top: 1rem; }
[data-theme="dark"] .example-scenario { background: rgba(59,130,246,0.1); }
.click-prompt { text-align: center; color: var(--mid); font-size: 0.85rem; margin-top: 1rem; padding: 0.85rem; background: var(--surface-2); border-radius: 8px; font-style: italic; }
.action-btn { padding: 0.55rem 1.1rem; background: var(--green); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.88rem; margin-top: 0.6rem; }
.action-btn:hover { filter: brightness(1.1); }
.action-btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

/* ───── Comparison slider ───── */
.compare-slider-wrap {
  padding: 2rem 1.5rem;
  background: var(--surface-2);
}
.compare-row {
  display: grid;
  grid-template-columns: 160px 1fr;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
}
.compare-row .label-cell {
  font-weight: 700;
  font-size: 0.92rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.compare-row .label-cell .icon { font-size: 1.2rem; }
.compare-bars {
  display: grid;
  grid-template-columns: repeat(var(--bar-count, 3), 1fr);
  gap: 0.5rem;
  height: 32px;
}
.compare-bar {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  z-index: 1;
}
.compare-bar-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--bar-color, var(--blue)) 0%, var(--bar-color, var(--blue)) 100%);
  opacity: 0.85;
  border-radius: 7px 0 0 7px;
  transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: -1;
}
.compare-bar-text { position: relative; z-index: 2; padding: 0 0.5rem; mix-blend-mode: difference; color: white; }
.compare-row.winner .compare-bar.is-winner { border-color: var(--green); border-width: 2.5px; }
.compare-row.winner .compare-bar.is-winner::after {
  content: '★'; position: absolute; top: -8px; right: 6px;
  background: var(--green); color: white; width: 22px; height: 22px;
  border-radius: 50%; display: grid; place-items: center;
  font-size: 0.8rem; font-weight: 700;
}
.compare-options {
  display: grid;
  grid-template-columns: repeat(var(--bar-count, 3), 1fr);
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}
.compare-option-header {
  text-align: center;
  font-family: var(--font-display);
  font-weight: 700;
  padding: 0.6rem 0.85rem;
  border-radius: 8px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  font-size: 1rem;
}
.scenario-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; padding: 1rem 1.5rem; background: var(--surface); border-bottom: 1px solid var(--border); }
.scenario-btn {
  padding: 0.5rem 1rem;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 0.85rem;
  cursor: pointer;
  font-weight: 500;
}
.scenario-btn:hover { border-color: var(--blue); }
.scenario-btn.active { background: var(--blue); color: white; border-color: var(--blue); }
.compare-conclusion {
  padding: 1.25rem 1.5rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 0.95rem;
  line-height: 1.55;
}

/* ───── Step-by-step animation ───── */
.step-stage {
  padding: 1.5rem;
  background: var(--surface-2);
  min-height: 460px;
  position: relative;
}
.step-svg { width: 100%; height: auto; max-width: 760px; display: block; margin: 0 auto; }
.step-controls {
  display: flex;
  gap: 0.6rem;
  padding: 1rem 1.5rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
  align-items: center;
  flex-wrap: wrap;
}
.step-progress {
  flex: 1;
  display: flex;
  gap: 0.3rem;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--mid);
}
.step-progress-bar {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 100px;
  position: relative;
  overflow: hidden;
}
.step-progress-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--blue), var(--purple));
  border-radius: 100px;
  transition: width 0.4s;
}
.step-info {
  padding: 1.25rem 1.5rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.step-info h3 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  margin-bottom: 0.5rem;
}
.step-info p { color: var(--text-mid); line-height: 1.55; }
.step-info .step-num {
  display: inline-block;
  background: var(--blue);
  color: white;
  padding: 0.2rem 0.6rem;
  border-radius: 100px;
  font-size: 0.75rem;
  font-weight: 700;
  margin-bottom: 0.4rem;
}

/* ───── Drag-and-drop quiz ───── */
.dnd-stage {
  padding: 1.5rem;
  background: var(--surface-2);
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 1.5rem;
  min-height: 520px;
}
@media (max-width: 800px) {
  .dnd-stage { grid-template-columns: 1fr; }
}
.dnd-bank {
  background: var(--surface);
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  min-height: 200px;
}
.dnd-bank h3 {
  font-family: var(--font-display);
  font-size: 0.95rem;
  margin-bottom: 0.75rem;
  text-align: center;
}
.dnd-label {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: white;
  padding: 0.55rem 0.85rem;
  border-radius: 8px;
  margin-bottom: 0.5rem;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: grab;
  user-select: none;
  text-align: center;
  transition: transform 0.15s, opacity 0.15s;
}
.dnd-label:hover { transform: scale(1.03); }
.dnd-label.dragging { opacity: 0.5; cursor: grabbing; }
.dnd-label.placed { display: none; }
.dnd-targets {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 1.5rem;
  position: relative;
}
.dnd-target {
  background: var(--surface-2);
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  margin-bottom: 0.75rem;
  transition: all 0.15s;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.dnd-target.drag-over {
  border-color: var(--blue);
  background: var(--blue-light);
  border-style: solid;
}
.dnd-target.correct { border-color: var(--green); border-style: solid; background: var(--green-light); }
.dnd-target.incorrect { border-color: var(--red); border-style: solid; background: #FEE2E2; }
[data-theme="dark"] .dnd-target.correct { background: rgba(34,197,94,0.15); }
[data-theme="dark"] .dnd-target.incorrect { background: rgba(239,68,68,0.15); }
.dnd-target .target-desc { font-size: 0.85rem; color: var(--text-mid); line-height: 1.5; }
.dnd-target .placed-label {
  display: inline-block;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: white;
  padding: 0.35rem 0.7rem;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  align-self: flex-start;
}
.dnd-target.correct .placed-label { background: var(--green); }
.dnd-target.incorrect .placed-label { background: var(--red); }
.dnd-result-badge {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 700;
  margin-left: 0.5rem;
  padding: 0.1rem 0.5rem;
  border-radius: 4px;
}
.dnd-result-badge.correct { background: var(--green); color: white; }
.dnd-result-badge.incorrect { background: var(--red); color: white; }
.dnd-toolbar {
  padding: 1rem 1.5rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0.6rem;
  align-items: center;
  flex-wrap: wrap;
}
.dnd-score {
  font-family: var(--font-display);
  font-weight: 700;
  margin-left: auto;
}

/* ───── Database (Ch 10) ───── */
.db-table {
  background: var(--surface);
  border: 2px solid var(--ch-color, var(--blue));
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.15s;
}
.db-table:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.db-table-header {
  background: var(--ch-color, var(--blue));
  color: white;
  padding: 0.55rem 0.85rem;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.95rem;
}
.db-table-fields { padding: 0.5rem 0.85rem; font-size: 0.82rem; }
.db-field { padding: 0.2rem 0; }
.db-field.pk { color: var(--amber); font-weight: 700; }
.db-field.fk { color: var(--purple); font-style: italic; }
.db-relations-svg { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.db-relation-line { stroke: var(--mid); stroke-width: 2; fill: none; }
</style>
</head>
<body>

<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main fade-in">
    <div class="quiz-hero" style="background: linear-gradient(135deg, #3730A3 0%, #1D4ED8 100%);">
      <span class="hero-tag">Visual learning</span>
      <h1>🔬 Interactive Diagrams</h1>
      <p>Click, drag and explore. Each diagram lets you interact with the parts to learn how they fit together. Ten diagrams across all chapters of the spec — one for every major visual concept.</p>
    </div>

    <div id="diagramHub"></div>
    <div id="diagramViewer"></div>
  </main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/search-index.js"></script>
<script src="assets/js/streaks.js"></script>
<script src="assets/js/app.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   DIAGRAM HUB
   ═══════════════════════════════════════════════════════════════════ */

const DIAGRAMS = [
  { id: 'pc_anatomy',   chapter: 1, type: 'Concept explorer',       icon: '🖥', title: 'Anatomy of a Computer',
    summary: 'Click each component (CPU, RAM, motherboard, storage) to see what it does and why it matters.', color: '#B45309' },
  { id: 'software_stack', chapter: 2, type: 'Concept explorer',     icon: '💿', title: 'The Software Stack',
    summary: 'Click each layer (firmware, OS, system software, applications) to see how they relate and depend on each other.', color: '#0F766E' },
  { id: 'storage_compare', chapter: 3, type: 'Comparison slider',   icon: '💾', title: 'HDD vs SSD vs Cloud',
    summary: 'Compare three storage technologies on speed, capacity, durability, cost and reliability. See which wins for each scenario.', color: '#0F766E' },
  { id: 'fde_cycle',    chapter: 4, type: 'Step-by-step animation', icon: '⚙', title: 'CPU Fetch-Decode-Execute Cycle',
    summary: 'Walk through how the CPU runs an instruction. Step through each stage to see registers, ALU, and memory bus in action.', color: '#1D4ED8' },
  { id: 'topologies',   chapter: 5, type: 'Concept explorer',       icon: '🌐', title: 'Network Topologies',
    summary: 'Compare bus, star, ring, and mesh networks. Click any device to learn its role.', color: '#1D4ED8' },
  { id: 'security_quiz',chapter: 6, type: 'Drag-and-drop quiz',     icon: '🛡', title: 'Label the Security Threats',
    summary: 'Drag each threat (phishing, malware, ransomware…) to its correct description. Get scored on accuracy.', color: '#B91C1C' },
  { id: 'page_load',    chapter: 7, type: 'Step-by-step animation', icon: '📡', title: 'How a Web Page Loads',
    summary: 'Trace a request from your browser through DNS, routers, the server, and back — one step at a time.', color: '#7C3AED' },
  { id: 'craab_quiz',   chapter: 8, type: 'Drag-and-drop quiz',     icon: '🔍', title: 'CRAAB: Evaluate a Source',
    summary: 'Match each evaluation criterion (Currency, Relevance, Authority, Accuracy, Bias) to its definition.', color: '#15803D' },
  { id: 'cloud_compare',chapter: 9, type: 'Comparison slider',      icon: '☁', title: 'On-premises vs Cloud',
    summary: 'Compare hosting your own server vs using cloud services on cost, scalability, security, and control. See which fits each scenario.', color: '#0F766E' },
  { id: 'db_relations', chapter:10, type: 'Concept explorer',       icon: '🗃', title: 'Database Relationships',
    summary: 'Explore tables, primary keys, foreign keys, and one-to-many relationships in a real club membership database.', color: '#6D28D9' }
];

function renderHub() {
  document.getElementById('diagramViewer').innerHTML = '';
  document.getElementById('diagramHub').innerHTML = `
    <h2 class="section-title">📚 All 10 diagrams</h2>
    <div class="diagram-hub">
      ${DIAGRAMS.map(d => `
        <div class="diagram-card" style="--ch-color:${d.color};" onclick="openDiagram('${d.id}')">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="icon">${d.icon}</div>
            <span style="font-size:0.7rem; background:var(--green); color:white; padding:0.2rem 0.55rem; border-radius:100px; font-weight:700; text-transform:uppercase;">Available</span>
          </div>
          <div class="meta">Chapter ${d.chapter}</div>
          <h4>${d.title}</h4>
          <p>${d.summary}</p>
          <span class="diagram-type-tag">${d.type}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function openDiagram(id) {
  document.getElementById('diagramHub').innerHTML = '';
  if (window.recordActivity) window.recordActivity('mindmap');
  const renderers = {
    pc_anatomy: renderPCAnatomy,
    software_stack: renderSoftwareStack,
    storage_compare: renderStorageCompare,
    fde_cycle: renderFDECycle,
    topologies: renderTopologies,
    security_quiz: renderSecurityQuiz,
    page_load: renderPageLoad,
    craab_quiz: renderCraabQuiz,
    cloud_compare: renderCloudCompare,
    db_relations: renderDbRelations
  };
  (renderers[id] || (() => {}))();
}

function closeDiagram() {
  document.getElementById('diagramViewer').innerHTML = '';
  renderHub();
}

function diagramShell(diagId, color, title, subtitle, bodyHtml) {
  const d = DIAGRAMS.find(d => d.id === diagId);
  return `
    <div class="diagram-back-bar">
      <button class="back-btn" onclick="closeDiagram()">
        <span style="font-size:1.1em;">←</span> All diagrams
      </button>
    </div>

  document.getElementById('storageScenarios').innerHTML = Object.entries(STORAGE_DATA).map(([k, v]) => `
    <button class="scenario-btn ${k === currentStorageScenario ? 'active' : ''}" onclick="setStorageScenario('${k}')">${v.name}</button>

          <div class="compare-bars" style="--bar-count: ${STORAGE_OPTIONS.length};">

              const isWinner = v === maxVal && v > 0;
              const color = o === 'HDD' ? '#B45309' : o === 'SSD' ? '#1D4ED8' : '#0F766E';

}

function drawFDE() {
  const step = FDE_STEPS[fdeStep];
  const hi = id => step.highlight.includes(id);
  const boxColor = id => hi(id) ? '#1D4ED8' : '#94A3B8';
  const boxOpacity = id => hi(id) ? '1' : '0.5';

      <text x="200" y="115" text-anchor="middle" fill="white" font-size="11" font-weight="700">MAR</text>
      <text x="200" y="142" text-anchor="middle" fill="#475569" font-size="9">Mem Addr Reg</text>

      <!-- MDR -->
      <rect x="60" y="155" width="80" height="34" rx="4" fill="${boxColor('mdr')}" opacity="${boxOpacity('mdr')}"/>
      <text x="100" y="175" text-anchor="middle" fill="white" font-size="11" font-weight="700">MDR</text>
      <text x="100" y="200" text-anchor="middle" fill="#475569" font-size="9">Mem Data Reg</text>

      <!-- CIR -->
      <rect x="160" y="155" width="80" height="34" rx="4" fill="${boxColor('cir')}" opacity="${boxOpacity('cir')}"/>
      <text x="200" y="175" text-anchor="middle" fill="white" font-size="11" font-weight="700">CIR</text>
      <text x="200" y="200" text-anchor="middle" fill="#475569" font-size="9">Curr Instr Reg</text>

      <!-- Control Unit -->
      <rect x="290" y="80" width="100" height="60" rx="6" fill="${boxColor('cu')}" opacity="${boxOpacity('cu')}"/>
      <text x="340" y="115" text-anchor="middle" fill="white" font-size="13" font-weight="700">CU</text>
      <text x="340" y="150" text-anchor="middle" fill="#475569" font-size="9">Control Unit</text>

      <!-- ALU -->
      <polygon points="290,180 390,180 410,220 270,220" fill="${boxColor('alu')}" opacity="${boxOpacity('alu')}"/>
      <text x="340" y="205" text-anchor="middle" fill="white" font-size="13" font-weight="700">ALU</text>
      <text x="340" y="240" text-anchor="middle" fill="#475569" font-size="9">Arithmetic/Logic</text>

      <!-- Address bus arrow CPU → RAM -->
      <line x1="240" y1="112" x2="540" y2="112" stroke="${lineColor('address-bus')}" stroke-width="${lineW('address-bus')}"
            marker-end="url(#arrowFDE)"/>
      <text x="395" y="105" text-anchor="middle" font-size="9" fill="${hi('address-bus') ? '#1D4ED8' : '#94A3B8'}" font-weight="${hi('address-bus') ? '700' : '500'}">Address Bus</text>

      <!-- Data bus arrow RAM → CPU -->
      <line x1="540" y1="172" x2="140" y2="172" stroke="${lineColor('data-bus')}" stroke-width="${lineW('data-bus')}"
            marker-end="url(#arrowFDE)"/>
      <text x="395" y="166" text-anchor="middle" font-size="9" fill="${hi('data-bus') ? '#1D4ED8' : '#94A3B8'}" font-weight="${hi('data-bus') ? '700' : '500'}">Data Bus</text>

      <!-- PC-to-MAR arrow -->
      <line x1="140" y1="112" x2="160" y2="112" stroke="${lineColor('pc-to-mar')}" stroke-width="${lineW('pc-to-mar')}" marker-end="url(#arrowFDE)"/>

      ${hi('pc-incr') ? `<text x="100" y="88" text-anchor="middle" font-size="10" fill="#1D4ED8" font-weight="700">+1 ↑</text>` : ''}

      <!-- RAM -->
      <rect x="555" y="80" width="120" height="200" rx="8" fill="${hi('ram') ? '#0F766E' : '#94A3B8'}" opacity="${hi('ram') ? '0.85' : '0.4'}"/>

      <defs>

  `;
  document.getElementById('fdeStepLabel').textContent = `Step ${fdeStep + 1} of ${FDE_STEPS.length}`;
  document.getElementById('fdeProgressFill').style.width = `${((fdeStep + 1) / FDE_STEPS.length) * 100}%`;
  document.getElementById('fdePrevBtn').disabled = fdeStep === 0;
  document.getElementById('fdeNextBtn').disabled = fdeStep === FDE_STEPS.length - 1;
}

function fdeNext() { if (fdeStep < FDE_STEPS.length - 1) { fdeStep++; drawFDE(); } }
function fdePrev() { if (fdeStep > 0) { fdeStep--; drawFDE(); } }
function fdeReset() { fdeStep = 0; drawFDE(); }

let currentTopology = 'star', selectedTopologyDevice = null, topologySimActive = false;

function renderTopologies() {
  currentTopology = 'star'; selectedTopologyDevice = null; topologySimActive = false;
  document.getElementById('diagramViewer').innerHTML = diagramShell(
    'topologies', '#1D4ED8',
    'Network Topologies',
    'Chapter 5 · Click devices to learn how each topology works',
    `<div class="diag-tabs" id="topoTabs"></div>
     <div class="two-pane">
       <div class="svg-area" id="topoSvg"></div>
       <div class="info-area" id="topoInfo"></div>
     </div>`
  );
  drawTopology();
}

function drawTopology() {
  const t = TOPOLOGIES[currentTopology];
  document.getElementById('topoTabs').innerHTML = Object.keys(TOPOLOGIES).map(k => `
    <button class="diag-tab ${k === currentTopology ? 'active' : ''}" onclick="switchTopology('${k}')">${TOPOLOGIES[k].name}</button>
  `).join('');

  const isSel = id => selectedTopologyDevice === id ? 'selected' : '';
  const dev = (d) => {
    const isCentre = d.isCenter;
    const colour = isCentre ? '#1D4ED8' : '#0F766E';
    return `
      <g class="dev ${isSel(d.id)}" data-id="${d.id}" onclick="selectTopologyDevice('${d.id}')">
        <circle class="device-body" cx="${d.x}" cy="${d.y}" r="${isCentre ? 28 : 22}" fill="${colour}" stroke="white" stroke-width="3"/>
        <text x="${d.x}" y="${d.y + 4}" text-anchor="middle" fill="white" font-size="${isCentre ? 12 : 10}" font-weight="700">${isCentre ? 'HUB' : d.label.split(' ')[1] || ''}</text>
        <text x="${d.x}" y="${d.y + (isCentre ? 50 : 40)}" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="600">${d.label}</text>
      </g>
    `;
  };

  let connLines = '';
  if (currentTopology === 'bus') {
    connLines += `<line class="connection ${topologySimActive ? 'active' : ''}" x1="${t.busLine.x1}" y1="${t.busLine.y1}" x2="${t.busLine.x2}" y2="${t.busLine.y2}"/>`;
    t.stubs.forEach(s => {
      const d = t.devices.find(dv => dv.id === s.device);
      if (d) connLines += `<line class="connection" x1="${d.x}" y1="${d.y}" x2="${d.x}" y2="${s.y}"/>`;
    });
  } else {
    t.connections.forEach(c => {
      const a = t.devices.find(d => d.id === c.from);
      const b = t.devices.find(d => d.id === c.to);
      if (a && b) {
        const isActive = topologySimActive && currentTopology === 'star' && c.from === selectedTopologyDevice;
        connLines += `<line class="connection ${isActive ? 'active' : ''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
      }
    });
  }

  document.getElementById('topoSvg').innerHTML = `
    <svg class="interactive-svg" viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">
      ${connLines}
      ${t.devices.map(dev).join('')}
    </svg>
  `;
  document.getElementById('topoInfo').innerHTML = renderTopologyInfo(t);
}

function switchTopology(k) { currentTopology = k; selectedTopologyDevice = null; topologySimActive = false; drawTopology(); }
function selectTopologyDevice(id) { selectedTopologyDevice = id; drawTopology(); }

function renderTopologyInfo(t) {
  let deviceDetail = '';
  if (selectedTopologyDevice) {
    const d = t.devices.find(dv => dv.id === selectedTopologyDevice);
    if (d) {
      const role = d.isCenter
        ? 'This is the central hub/switch. All communication in a star topology passes through this device. If it fails, the entire network goes down.'
        : `This is a connected node. ${currentTopology === 'star' ? 'It can only communicate by sending data through the central hub.' : currentTopology === 'bus' ? 'It shares the same cable as every other device. Only one device can transmit at a time.' : currentTopology === 'ring' ? 'Data passes through this device on its way around the ring. If this device fails, the ring breaks.' : 'This router has direct connections to multiple others, providing alternative paths if any single connection fails.'}`;
      deviceDetail = `
        <div class="info-section" style="background:var(--blue-light); padding:0.85rem 1rem; border-radius:8px; border-left:3px solid var(--blue);">
          <h4 style="color:var(--blue);">Selected: ${d.label}</h4>
          <p style="font-size:0.88rem; margin:0;">${role}</p>
        </div>

    }
  }
  return `
    <div class="info-title">${t.name}</div>
    <p style="color:var(--text-mid); font-size:0.92rem; line-height:1.55; margin-bottom:1rem;">${t.description}</p>
    ${deviceDetail}
    <div class="pros-cons">
      <div class="pros-box"><strong>✓ ADVANTAGES</strong><ul>${t.pros.map(p => `<li>${p}</li>`).join('')}</ul></div>
      <div class="cons-box"><strong>✕ DISADVANTAGES</strong><ul>${t.cons.map(c => `<li>${c}</li>`).join('')}</ul></div>
    </div>
    <div class="example-scenario"><strong>💡 Real-world example:</strong> ${t.example}</div>
    ${!selectedTopologyDevice ? `<div class="click-prompt">👆 Click any device above to learn about its role</div>` : ''}
    <button class="action-btn" onclick="toggleTopologySim()">${topologySimActive ? '⏸ Stop simulation' : '▶ Simulate data flow'}</button>
  `;
}

function toggleTopologySim() {
  topologySimActive = !topologySimActive;
  drawTopology();
  if (topologySimActive) setTimeout(() => { topologySimActive = false; drawTopology(); }, 6000);
}

  ]
};

let dndState = { placements: {}, dragging: null, scored: false };

function renderSecurityQuiz() {
  dndState = { placements: {}, dragging: null, scored: false };
  window._activeDndData = SECURITY_QUIZ;
  // Shuffle descriptions so the order doesn't give it away
  const shuffled = [...SECURITY_QUIZ.descriptions].sort(() => Math.random() - 0.5);
  document.getElementById('diagramViewer').innerHTML = diagramShell(
    'security_quiz', '#B91C1C',
    SECURITY_QUIZ.title,
    'Chapter 6 · Drag threats to their descriptions',
    `<div style="padding:1rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); font-size:0.92rem; color:var(--text-mid);">${SECURITY_QUIZ.instructions}</div>
     <div class="dnd-stage">
       <div class="dnd-bank" id="dndBank">
         <h3>🏷 Threats</h3>
         ${SECURITY_QUIZ.threats.map(t => `
           <div class="dnd-label" draggable="true" data-id="${t.id}"
                ondragstart="dndDragStart(event, '${t.id}')"
                ondragend="dndDragEnd(event)">${t.label}</div>
         `).join('')}
       </div>
       <div class="dnd-targets" id="dndTargets">
         ${shuffled.map(d => `
           <div class="dnd-target" data-target="${d.id}"
                ondragover="dndDragOver(event)"
                ondragleave="dndDragLeave(event)"
                ondrop="dndDrop(event, '${d.id}')">
             <div class="target-desc">${d.text}</div>
           </div>
         `).join('')}
       </div>
     </div>
     <div class="dnd-toolbar">
       <button class="action-btn" onclick="dndScore()" id="dndScoreBtn">✓ Check my answers</button>
       <button class="action-btn secondary" onclick="dndReset()">↻ Reset</button>
       <div class="dnd-score" id="dndScoreText"></div>
     </div>`
  );
}

function dndDragStart(e, id) { dndState.dragging = id; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function dndDragEnd(e) { e.target.classList.remove('dragging'); }
function dndDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dndDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function dndDrop(e, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dndState.dragging) return;
  const draggedId = dndState.dragging;
  // Remove the dragged threat from any existing placement
  Object.keys(dndState.placements).forEach(tid => {
    if (dndState.placements[tid] === draggedId) delete dndState.placements[tid];
  });
  dndState.placements[targetId] = draggedId;
  dndState.dragging = null;
  dndScored = false;
  redrawDnD();
}

function redrawDnD() {
  const activeData = window._activeDndData || SECURITY_QUIZ;
  // Update bank — hide placed labels
  const placedIds = Object.values(dndState.placements);
  document.querySelectorAll('#dndBank .dnd-label').forEach(el => {
    el.classList.toggle('placed', placedIds.includes(el.dataset.id));
  });
  // Update targets
  document.querySelectorAll('#dndTargets .dnd-target').forEach(t => {
    t.classList.remove('correct', 'incorrect');
    const placed = dndState.placements[t.dataset.target];
    // Remove old label and badge, keep description
    t.querySelectorAll('.placed-label, .dnd-result-badge').forEach(el => el.remove());
    if (placed) {
      const threat = activeData.threats.find(x => x.id === placed);
      if (!threat) return;
      const lbl = document.createElement('div');
      lbl.className = 'placed-label';
      lbl.textContent = threat.label;
      lbl.draggable = true;
      lbl.dataset.id = threat.id;
      lbl.addEventListener('dragstart', e => dndDragStart(e, threat.id));
      lbl.addEventListener('dragend', dndDragEnd);
      t.insertBefore(lbl, t.firstChild);
    }
  });
}

function dndScore() {
  const data = window._activeDndData || SECURITY_QUIZ;
  let correct = 0;
  document.querySelectorAll('#dndTargets .dnd-target').forEach(t => {
    const tid = t.dataset.target;
    const placed = dndState.placements[tid];
    if (placed === tid) {
      t.classList.add('correct');
      correct++;
      // Add badge after label
      const lbl = t.querySelector('.placed-label');
      if (lbl) {
        const badge = document.createElement('span');
        badge.className = 'dnd-result-badge correct';
        badge.textContent = '✓ correct';
        lbl.appendChild(badge);
      }
    } else if (placed) {
      t.classList.add('incorrect');
      const lbl = t.querySelector('.placed-label');
      if (lbl) {
        const badge = document.createElement('span');
        badge.className = 'dnd-result-badge incorrect';
        const correctName = data.threats.find(x => x.id === tid)?.label || '?';
        badge.textContent = `✕ should be ${correctName}`;
        lbl.appendChild(badge);
      }
    }
  });
  dndState.scored = true;
  const total = data.threats.length;
  document.getElementById('dndScoreText').innerHTML = `Score: <span style="color:${correct === total ? 'var(--green)' : correct >= total/2 ? 'var(--amber)' : 'var(--red)'};">${correct} / ${total}</span>`;
  if (window.recordActivity) window.recordActivity('question');
}

function dndReset() {
  dndState = { placements: {}, dragging: null, scored: false };
  renderSecurityQuiz();
}

    info.innerHTML = `
      <div class="info-title">A relational database</div>
      <p style="color:var(--text-mid); font-size:0.92rem; line-height:1.55;">This is a typical 3-table design for a club management system. Tables connect via foreign keys, allowing you to ask questions like "what did John Smith pay in March?" without storing duplicate data.</p>
      <div class="info-section">
        <h4>Key concepts</h4>
        <ul>
          <li><strong>Primary key (PK)</strong>: uniquely identifies each row</li>
          <li><strong>Foreign key (FK)</strong>: references a primary key in another table</li>
          <li><strong>One-to-many</strong>: one parent row links to many child rows</li>
          <li><strong>Normalisation</strong>: split data into multiple tables to avoid duplication</li>
        </ul>
      </div>
      <div class="click-prompt">👆 Click any table to explore its fields and relationships</div>
    `;
    return;
  }
  const td = DB_TABLES[selectedDBTable];
  info.innerHTML = `
    <div class="info-title" style="color:${td.color};">${td.name} table</div>
    <p style="color:var(--text-mid); font-size:0.92rem; line-height:1.55; margin-bottom:1rem;">${td.description}</p>
    <div class="info-section">
      <h4>Rules</h4>
      <ul>${td.rules.map(r => `<li>${r}</li>`).join('')}</ul>
    </div>
    <div class="example-scenario">
      <strong>💡 Example row:</strong> ${td.examples}
    </div>
  `;
}
