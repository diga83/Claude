# Decap CMS configuration — the blog admin at /admin/
#
# Login is provided by DecapBridge (https://decapbridge.com) — Netlify's own
# Identity/Git Gateway service is deprecated and unavailable on new sites.
# Setup steps are in the README. After creating the site in the DecapBridge
# dashboard, replace YOUR_DECAPBRIDGE_SITE_ID below with the ID it gives you.

backend:
  name: git-gateway
  repo: diga83/Claude
  branch: claude/relaxed-faraday-l80n6k
  identity_url: https://auth.decapbridge.com/sites/YOUR_DECAPBRIDGE_SITE_ID
  gateway_url: https://gateway.decapbridge.com

# Where uploaded images are stored in the repo / served from on the site
media_folder: "public/images/blog"
public_folder: "/images/blog"

# Enable drafts via an editorial workflow (Draft -> In review -> Ready)
publish_mode: editorial_workflow

site_url: https://kittydrama.com
display_url: https://kittydrama.com

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", hint: "Shown in post cards, search engines, and social shares. Aim for 120-155 characters." }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false, hint: "Optional. Landscape images (16:9) look best." }
      - { label: "Tags", name: "tags", widget: "list", default: [], required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, hint: "Drafts are excluded from the published site." }
      - { label: "Body", name: "body", widget: "markdown" }
