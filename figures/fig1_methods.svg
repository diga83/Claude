</defs><rect width="1240" height="430" fill="#ffffff"/><rect x="14" y="40" width="216" height="128" rx="12" ry="12" fill="#eef3f9" stroke="#2E5A88" stroke-width="2"/><text x="122.0" y="74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1d1d1f" text-anchor="middle" font-weight="bold" font-style="normal">1. Scope</text><text x="122.0" y="104" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Decompose the question</text><text x="122.0" y="123" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">into five search angles</text><line x1="234" y1="104.0" x2="256" y2="104.0" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arr)"/><rect x="258" y="40" width="216" height="128" rx="12" ry="12" fill="#eef3f9" stroke="#2E5A88" stroke-width="2"/><text x="366.0" y="74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1d1d1f" text-anchor="middle" font-weight="bold" font-style="normal">2. Search</text><text x="366.0" y="104" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Five agents query</text><text x="366.0" y="123" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">the web in parallel</text><line x1="478" y1="104.0" x2="500" y2="104.0" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arr)"/><rect x="502" y="40" width="216" height="128" rx="12" ry="12" fill="#eef3f9" stroke="#2E5A88" stroke-width="2"/><text x="610.0" y="74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1d1d1f" text-anchor="middle" font-weight="bold" font-style="normal">3. Fetch &amp; extract</text><text x="610.0" y="104" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">De-duplicate sources;</text><text x="610.0" y="123" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">extract falsifiable claims</text><line x1="722" y1="104.0" x2="744" y2="104.0" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arr)"/><rect x="746" y="40" width="216" height="128" rx="12" ry="12" fill="#e6f2ea" stroke="#2f7d4f" stroke-width="2"/><text x="854.0" y="74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1d1d1f" text-anchor="middle" font-weight="bold" font-style="normal">4. Verify</text><text x="854.0" y="104" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Adversarial vote; claims</text><text x="854.0" y="123" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">failing 2 / 3 are dropped</text><line x1="966" y1="104.0" x2="988" y2="104.0" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arr)"/><rect x="990" y="40" width="216" height="128" rx="12" ry="12" fill="#eef3f9" stroke="#2E5A88" stroke-width="2"/><text x="1098.0" y="74" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1d1d1f" text-anchor="middle" font-weight="bold" font-style="normal">5. Synthesise</text><text x="1098.0" y="104" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Merge, rank by confidence,</text><text x="1098.0" y="123" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">cite by source tier</text><text x="14" y="234" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">Search fans out across five angles:</text><rect x="14" y="240" width="226" height="40" rx="20" ry="20" fill="#f7f9fc" stroke="#c4d0de" stroke-width="1.2"/><text x="127.0" y="265" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#2E5A88" text-anchor="middle" font-weight="bold" font-style="normal">Classical sources</text><rect x="252" y="240" width="226" height="40" rx="20" ry="20" fill="#f7f9fc" stroke="#c4d0de" stroke-width="1.2"/><text x="365.0" y="265" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#2E5A88" text-anchor="middle" font-weight="bold" font-style="normal">Philology</text><rect x="490" y="240" width="226" height="40" rx="20" ry="20" fill="#f7f9fc" stroke="#c4d0de" stroke-width="1.2"/><text x="603.0" y="265" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#2E5A88" text-anchor="middle" font-weight="bold" font-style="normal">Design history</text><rect x="728" y="240" width="226" height="40" rx="20" ry="20" fill="#f7f9fc" stroke="#c4d0de" stroke-width="1.2"/><text x="841.0" y="265" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#2E5A88" text-anchor="middle" font-weight="bold" font-style="normal">HCI / UX</text><rect x="966" y="240" width="226" height="40" rx="20" ry="20" fill="#f7f9fc" stroke="#c4d0de" stroke-width="1.2"/><text x="1079.0" y="265" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#2E5A88" text-anchor="middle" font-weight="bold" font-style="normal">Incidents</text><line x1="365.0" y1="240" x2="366.0" y2="170" stroke="#2E5A88" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrn)"/><rect x="14" y="330" width="1212" height="64" rx="10" ry="10" fill="#fbfcfe" stroke="#c4d0de" stroke-width="1.2"/><text x="32" y="355" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="bold" font-style="normal">Source-quality tiers (applied in synthesis):</text><circle cx="40" cy="377" r="5" fill="#2E5A88" opacity="1.0"/><text x="52" y="381" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">primary text</text><circle cx="173.6" cy="377" r="5" fill="#2E5A88" opacity="0.87"/><text x="185.6" y="381" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">peer-reviewed</text><circle cx="314.5" cy="377" r="5" fill="#2E5A88" opacity="0.74"/><text x="326.5" y="381" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">standards body</text><circle cx="462.7" cy="377" r="5" fill="#2E5A88" opacity="0.61"/><text x="474.7" y="381" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">reputable press</text><circle cx="618.2" cy="377" r="5" fill="#2E5A88" opacity="0.48"/><text x="630.2" y="381" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">vendor / grey lit.</text></svg>