if" font-size="16" fill="#b23b3b" text-anchor="start" font-weight="bold" font-style="normal">adipiscing</text><text x="637.44" y="436" font-family="DejaVu Serif, Georgia, serif" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="normal" font-style="normal"> elit, sed do </text><rect x="767.1200000000001" y="413" width="95.92" height="32" rx="6" fill="#f7e6e6" stroke="#b23b3b" stroke-width="1.1"/><text x="778.1200000000001" y="436" font-family="DejaVu Serif, Georgia, serif" font-size="16" fill="#b23b3b" text-anchor="start" font-weight="bold" font-style="normal">eiusmod</text><text x="873.0400000000001" y="436" font-family="DejaVu Serif, Georgia, serif" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="normal" font-style="normal"> tempor </text><rect x="948.0000000000001" y="413" width="127.60000000000001" height="32" rx="6" fill="#f7e6e6" stroke="#b23b3b" stroke-width="1.1"/><text x="959.0000000000001" y="436" font-family="DejaVu Serif, Georgia, serif" font-size="16" fill="#b23b3b" text-anchor="start" font-weight="bold" font-style="normal">incididunt</text><text x="1085.6000000000001" y="436" font-family="DejaVu Serif, Georgia, serif" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="normal" font-style="normal"> …</text><rect x="40" y="498" width="22" height="14" rx="3" fill="#e6f2ea" stroke="#2f7d4f"/><text x="70" y="510" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">retained Ciceronian fragment</text><rect x="340" y="498" width="22" height="14" rx="3" fill="#f7e6e6" stroke="#b23b3b"/><text x="370" y="510" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">non-existent / altered Latin</text><line x1="620" y1="505" x2="650" y2="505" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 4"/><text x="658" y="510" font-family="DejaVu Sans,