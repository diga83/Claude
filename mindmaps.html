<style>
.mm-hero {
  background: linear-gradient(135deg, #6D28D9 0%, #0F766E 100%);
  color: white;
  padding: 2rem 2.5rem;
  border-radius: var(--radius-lg);
  margin-bottom: 1.75rem;
}
.mm-hero h1 { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; }

.mm-chip-bar {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
  padding: 0.75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  position: sticky;
  top: calc(var(--header-h) + 8px);
  z-index: 50;
  backdrop-filter: blur(8px);
  background: rgba(255,255,255,0.92);
}
[data-theme="dark"] .mm-chip-bar { background: rgba(17,24,39,0.92); }

.mm-chip {
  padding: 0.45rem 0.9rem;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 100px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  color: var(--text-mid);
  transition: all 0.15s;
}
.mm-chip:hover { border-color: var(--border-strong); }
.mm-chip.active { background: var(--ch-color); color: white; border-color: var(--ch-color); font-weight: 600; }

.mm-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  overflow: hidden;
}
.mm-card .header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.25rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid var(--ch-color);
}
.mm-card .num {
  display: grid;
  place-items: center;
  width: 48px; height: 48px;
  background: var(--ch-color);
  color: white;
  border-radius: 12px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.mm-card .title {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
}
.mm-card .subtitle {
  font-size: 0.85rem;
  color: var(--mid);
  margin-top: 0.2rem;
}

.mm-svg-wrap {
  width: 100%;
  overflow-x: auto;
  background: var(--surface-2);
  border-radius: 12px;
  padding: 1rem;
  margin: 0.5rem 0;
}
.mm-svg-wrap svg {
  display: block;
  max-width: 100%;
  height: auto;
  min-width: 600px;
}

.mm-tip {
  margin-top: 1rem;
  padding: 0.85rem 1.1rem;
  background: var(--amber-light);
  border-left: 4px solid var(--amber);
  border-radius: 8px;
  font-size: 0.9rem;
  color: var(--text-mid);
}
.mm-tip strong { color: var(--amber); }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#064E3B">
</head>

<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

      <p>One mind map per chapter showing how every spec point connects. Use these to see the big picture, spot gaps in your understanding, and consolidate before the exam.</p>
    </div>

    <div class="mm-chip-bar" id="chipBar"></div>

    <div id="mmContainer"></div>
  </main>
</div>

let currentMM = 1;

function renderChips() {
  document.getElementById('chipBar').innerHTML = CHAPTERS.map(ch => `
    <div class="mm-chip ${currentMM === ch.id ? 'active' : ''}"
         style="--ch-color:${ch.color};"
         onclick="goToMM(${ch.id})">Ch ${ch.id}: ${ch.title.split(' ')[0].replace(/[:,]$/, '')}</div>
  `).join('');
}

function goToMM(chId) {
  currentMM = chId;
  renderChips();
  renderMindMap();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (window.recordActivity) window.recordActivity('mindmap');
}

function renderMindMap() {
  const mm = MINDMAPS[currentMM];
  const ch = CHAPTERS.find(c => c.id === currentMM);
  if (!mm) {
    document.getElementById('mmContainer').innerHTML = '<p>Mind map not available.</p>';
    return;
  }
  document.getElementById('mmContainer').innerHTML = `
    <div class="mm-card" style="--ch-color:${ch.color};">
      <div class="header">
        <div class="num">${ch.id}</div>
        <div>
          <div class="title">${mm.title}</div>
          <div class="subtitle">${mm.subtitle}</div>
        </div>
      </div>
      <div class="mm-svg-wrap">${mm.svg}</div>
      <div class="mm-tip"><strong>💡 Exam tip:</strong> ${mm.tip}</div>
      <div style="display:flex; justify-content:space-between; margin-top:1.25rem; padding-top:1rem; border-top:1px solid var(--border); flex-wrap:wrap; gap:0.5rem;">
        <a class="btn" href="chapters/chapter-${currentMM}.html">📖 Read full chapter</a>
        <a class="btn btn-primary" href="mcq.html">⚡ Practice questions →</a>
      </div>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', () => {
  renderChips();
  renderMindMap();
});
