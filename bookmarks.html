<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks — International GCSE Computer Science 4CP0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
.bookmark-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.4rem;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  transition: all 0.15s;
  border-left: 4px solid var(--ch-color);
}
.bookmark-item:hover {
  box-shadow: var(--shadow);
  transform: translateX(2px);
}
.bookmark-info { flex: 1; min-width: 0; }
.bookmark-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.05rem;
  margin-bottom: 0.25rem;
}
.bookmark-meta { font-size: 0.82rem; color: var(--mid); }
.bookmark-actions { display: flex; gap: 0.5rem; }
.bookmark-empty {
  text-align: center;
  padding: 3rem 2rem;
  color: var(--text-mid);
  background: var(--surface);
  border: 2px dashed var(--border);
  border-radius: var(--radius);
}
.bookmark-empty .icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.6;
}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#064E3B">
</head>
<body>

<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main fade-in">
    <div class="quiz-hero" style="background: linear-gradient(135deg, #B45309 0%, #DC2626 100%);">
      <span class="hero-tag">Saved sections</span>
      <h1>🔖 Bookmarks</h1>
      <p>Sections of chapters you've bookmarked for quick access. Click any bookmark icon on a chapter heading to save it here.</p>
    </div>

    <div id="bookmarksContainer"></div>
  </main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/search-index.js"></script>
<script src="assets/js/streaks.js"></script>
<script src="assets/js/app.js"></script>
<script>
function renderBookmarks() {
  const container = document.getElementById('bookmarksContainer');
  let bookmarks = [];
  try { bookmarks = JSON.parse(localStorage.getItem('gcse_cs_bookmarks_v1') || '[]'); } catch(e) {}

  if (bookmarks.length === 0) {
    container.innerHTML = `
      <div class="bookmark-empty">
        <div class="icon">🔖</div>
        <h3 style="font-family:var(--font-display); margin-bottom:0.5rem;">No bookmarks yet</h3>
        <p style="margin-bottom:1rem;">Open any chapter and click the bookmark icon next to a section heading to save it here.</p>
        <a class="btn btn-primary" href="chapters/chapter-1.html">📖 Start with Chapter 1</a>
      </div>
    `;
    return;
  }

  // Group by chapter
  const byChapter = {};
  bookmarks.forEach(b => {
    if (!byChapter[b.chId]) byChapter[b.chId] = [];
    byChapter[b.chId].push(b);
  });

  let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
    <p style="color:var(--text-mid);"><strong>${bookmarks.length}</strong> bookmark${bookmarks.length === 1 ? '' : 's'} across <strong>${Object.keys(byChapter).length}</strong> chapter${Object.keys(byChapter).length === 1 ? '' : 's'}</p>
    <button class="btn" onclick="clearAllBookmarks()" style="color:var(--red); border-color:var(--red);">🗑 Clear all bookmarks</button>
  </div>`;

  Object.keys(byChapter).sort((a, b) => +a - +b).forEach(chId => {
    const ch = CHAPTERS.find(c => c.id === +chId);
    html += `<h2 class="section-title" style="margin-top:1.5rem; color:${ch.color};">Chapter ${chId}: ${ch.title}</h2>`;
    byChapter[chId].forEach(b => {
      html += `
        <div class="bookmark-item" style="--ch-color:${ch.color};">
          <div class="bookmark-info">
            <div class="bookmark-title">${b.title}</div>
            <div class="bookmark-meta">📅 Saved ${new Date(b.savedAt).toLocaleDateString()} · Chapter ${b.chId}</div>
          </div>
          <div class="bookmark-actions">
            <a class="btn btn-primary" href="${b.url}">Open →</a>
            <button class="btn" onclick="removeBookmark('${b.id}')" style="color:var(--red);">✕</button>
          </div>
        </div>
      `;
    });
  });

  container.innerHTML = html;
}

function removeBookmark(id) {
  let bookmarks = [];
  try { bookmarks = JSON.parse(localStorage.getItem('gcse_cs_bookmarks_v1') || '[]'); } catch(e) {}
  const filtered = bookmarks.filter(b => b.id !== id);
  try { localStorage.setItem('gcse_cs_bookmarks_v1', JSON.stringify(filtered)); } catch(e) {}
  renderBookmarks();
}

function clearAllBookmarks() {
  if (!confirm('Remove all bookmarks? This cannot be undone.')) return;
  try { localStorage.setItem('gcse_cs_bookmarks_v1', '[]'); } catch(e) {}
  renderBookmarks();
}

document.addEventListener('DOMContentLoaded', renderBookmarks);
</script>
</body>
</html>
