<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

  <title>Thank You | Dinesh Deckker</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .ty{min-height:72vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:140px 1.5rem 80px;
      background:radial-gradient(820px 460px at 50% -10%,var(--tint),transparent 70%),linear-gradient(180deg,#fff,var(--bg-2))}
    .ty-ic{width:74px;height:74px;border-radius:50%;background:var(--tint);border:1px solid var(--tint-2);display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem}
    .ty-ic svg{width:36px;height:36px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .ty h1{font-family:var(--serif);font-size:2rem;color:var(--ink);margin-bottom:.6rem}
    .ty p{color:var(--muted);max-width:460px;margin:0 auto 1.8rem;line-height:1.7}
  </style>
</head>
<body>
<main>
  <section class="ty">
    <div>
      <div class="ty-ic"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <h1>Thank you — message received</h1>
      <p>Thanks for reaching out. Your message has been sent and I'll get back to you as soon as possible, usually within 48 hours.</p>
      <a href="index.html" class="btn btn-primary">Back to Home</a>
    </div>
  </section>
</main>
<script src="nav-footer.js"></script>
</body>
</html>
