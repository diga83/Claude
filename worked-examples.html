// Worked examples — chapter-keyed; each entry has a question + 3 sample answers (excellent/medium/weak)
const WORKED_EXAMPLES = [
  {
    chapter: 1,
    question: "A team is creating a program to manage a school sports day: recording entries, timing races and displaying results. Explain how decomposition and abstraction could be used when designing this program.",
    marks: 4,
    answers: [
      {
        grade: "excellent",
        score: "4 / 4",
        label: "Full marks (4/4)",
        text: "Decomposition means breaking the problem down into smaller sub-problems (1). The sports day program could be split into separate parts such as 'record entries', 'time races' and 'display results', and each part could be designed, coded and tested as its own subprogram (1). Abstraction means removing unnecessary detail so the design focuses only on what matters (1). For example, the program only needs each runner's name, event and finishing time — details such as their height or what they are wearing can be ignored (1).",
        analysis: [
          { type: "tick", text: "Both terms DEFINED precisely using specification wording — 1 mark each" },
          { type: "tick", text: "Each definition APPLIED to the actual scenario (sports day), earning the second mark each time" },
          { type: "tick", text: "Linking decomposition to subprograms shows how the idea carries into the code" },
          { type: "tick", text: "A concrete example of detail being discarded makes the abstraction application mark safe" }
        ]
      },
      {
        grade: "medium",
        score: "2 / 4",
        label: "Partial marks (2/4)",
        text: "Decomposition is breaking a problem into smaller parts (1). Abstraction is removing unnecessary detail from a problem (1). Both of these would help the team design the program more easily.",
        analysis: [
          { type: "tick", text: "Decomposition defined correctly — 1 mark" },
          { type: "tick", text: "Abstraction defined correctly — 1 mark" },
          { type: "cross", text: "Neither term is APPLIED to the sports day scenario — the question says 'used when designing THIS program'" },
          { type: "cross", text: "'Would help the team' is generic filler — it could be written about any question and earns nothing" }
        ]
      },
      {
        grade: "weak",
        score: "1 / 4",
        label: "Weak answer (1/4)",
        text: "Decomposition means splitting the program up into smaller pieces (1). Abstraction is when the code is abstract and difficult to understand. They both make programming quicker.",
        analysis: [
          { type: "tick", text: "The decomposition idea is just creditable — 1 mark" },
          { type: "cross", text: "Abstraction definition is wrong — it is about REMOVING unnecessary detail, not about code being 'abstract' or hard to read" },
          { type: "cross", text: "No application to the scenario at all" },
          { type: "cross", text: "'Make programming quicker' is an unsupported assertion — no mark" }
        ]
      }
    ],
    examiner_note: "For 'explain how X could be used' questions on Topic 1, use the two-step formula every time: DEFINE the term in spec language, then APPLY it to the named scenario ('the sports day program could be split into...'). Each term is usually worth 2 marks: definition + application. Definitions alone cap you at half marks."
  },

  {
    chapter: 2,
    question: "An algorithm is intended to output the total of the numbers 1 to 4:<br><span style='font-family:var(--font-mono); font-style:normal; font-size:0.9rem;'>1&nbsp; mark = 0<br>2&nbsp; count = 1<br>3&nbsp; WHILE count &lt; 4<br>4&nbsp; &nbsp;&nbsp;mark = mark + count<br>5&nbsp; &nbsp;&nbsp;count = count + 1<br>6&nbsp; ENDWHILE<br>7&nbsp; OUTPUT mark</span><br>(a) State the actual output of the algorithm. (1)<br>(b) Explain why the algorithm does not work as intended and how to fix it. (3)",
    marks: 4,
    answers: [
      {
        grade: "excellent",
        score: "4 / 4",
        label: "Full marks (4/4)",
        text: "(a) The output is 6 (1). (b) The condition on line 3 uses &lt; instead of &lt;= (1). The loop stops as soon as count reaches 4, so 4 is never added to mark — only 1 + 2 + 3 = 6 is totalled (1). Changing line 3 to WHILE count &lt;= 4 makes the loop body run for count = 4 as well, giving the intended output of 10 (1).",
        analysis: [
          { type: "tick", text: "The student clearly TRACED the algorithm rather than assuming it works — output 6, not 10" },
          { type: "tick", text: "The exact faulty operator is named (&lt; instead of &lt;=) — precision earns the mark" },
          { type: "tick", text: "The CONSEQUENCE is explained: 4 is never added, so the sum is 1+2+3" },
          { type: "tick", text: "The fix is given as an exact line of code, not just 'change the loop'" }
        ]
      },
      {
        grade: "medium",
        score: "2 / 4",
        label: "Partial marks (2/4)",
        text: "(a) 6 (1). (b) The loop is wrong because it does not add up all of the numbers. It needs to run one more time to include the 4 (1).",
        analysis: [
          { type: "tick", text: "Output correctly traced as 6 — 1 mark" },
          { type: "tick", text: "Recognises the loop runs one iteration too few — 1 mark" },
          { type: "cross", text: "Does not identify the CAUSE — the &lt; condition on line 3 is never mentioned" },
          { type: "cross", text: "No concrete fix is given — 'run one more time' is the symptom, not the repair" }
        ]
      },
      {
        grade: "weak",
        score: "1 / 4",
        label: "Weak answer (1/4)",
        text: "(a) The output is 10 because the algorithm adds the numbers 1 to 4. (b) There is an error on line 3 (1). It is a syntax error so the program will not run. Line 3 needs rewriting.",
        analysis: [
          { type: "cross", text: "Output of 10 assumes the algorithm works as INTENDED — the student never traced it" },
          { type: "tick", text: "Locates the fault on line 3 — 1 mark" },
          { type: "cross", text: "Calls it a syntax error — wrong. The code runs but gives the wrong result, which is a LOGIC error" },
          { type: "cross", text: "'Needs rewriting' is not a fix — say exactly what to change (&lt; to &lt;=)" }
        ]
      }
    ],
    examiner_note: "Never assume an algorithm does what the question says it is 'intended' to do — that wording is a signal that it doesn't. Build a quick trace table (one column per variable, one row per loop pass) before answering. For error questions, give all three: the LINE, the CAUSE (exact operator or value), and the FIX (the corrected line). And know your error types: code that runs but gives the wrong answer is a logic error, never a syntax error."
  },

  {
    chapter: 3,
    question: "A sorted list holds 1,024 student ID numbers. Compare how a linear search and a binary search would find a target ID in this list, and explain which is more efficient.",
    marks: 6,
    answers: [
      {
        grade: "excellent",
        score: "6 / 6",
        label: "Full marks (6/6)",
        text: "A linear search starts at the first item and checks every item one by one until the target is found or the end of the list is reached (1). A binary search examines the middle item, then discards the half of the list that cannot contain the target, and repeats this on the remaining half (1). Binary search can only be used because the list is already sorted — linear search works on any list (1). In the worst case, the linear search would have to check all 1,024 items (1), whereas the binary search halves the list with each comparison, so it needs at most about 10 checks, because 2^10 = 1,024 (1). Therefore the binary search is far more efficient for this list, and the gap grows as the list gets larger (1).",
        analysis: [
          { type: "tick", text: "Both algorithms described mechanically and accurately — one mark each" },
          { type: "tick", text: "The precondition (binary search needs a SORTED list) is stated and linked to the scenario" },
          { type: "tick", text: "Worst cases QUANTIFIED: 1,024 checks vs about 10 — the 2^10 = 1,024 maths nails the comparison" },
          { type: "tick", text: "A clear, justified conclusion answers the 'which is more efficient' part of the question" }
        ]
      },
      {
        grade: "medium",
        score: "3 / 6",
        label: "Partial marks (3/6)",
        text: "A linear search checks each item in turn starting from the beginning (1). A binary search keeps cutting the list in half until it finds the item (1). Binary search is faster (1) so it is the one that should be used here.",
        analysis: [
          { type: "tick", text: "Linear search described — 1 mark" },
          { type: "tick", text: "Binary search halving idea described — 1 mark" },
          { type: "tick", text: "Correct conclusion that binary search is more efficient — 1 mark" },
          { type: "cross", text: "No numbers: 1,024 worst-case checks vs about 10 is the comparison the examiner is fishing for" },
          { type: "cross", text: "Never mentions that binary search REQUIRES a sorted list — a standard mark scheme point" }
        ]
      },
      {
        grade: "weak",
        score: "1 / 6",
        label: "Weak answer (1/6)",
        text: "A binary search is quicker than a linear search (1). A linear search looks through the list for the item. A binary search uses binary numbers so the computer can find things faster because computers work in binary.",
        analysis: [
          { type: "tick", text: "Bare assertion that binary search is quicker — 1 mark, generously" },
          { type: "cross", text: "Misconception: binary search has nothing to do with binary NUMBERS — it is 'binary' because it splits the list in two" },
          { type: "cross", text: "Neither algorithm's mechanism is actually described" },
          { type: "cross", text: "No mention of the sorted-list requirement or any worst-case figures" }
        ]
      }
    ],
    examiner_note: "Comparison questions are marked on PAIRED points: describe both algorithms on the same axes (how they work, what they require, worst-case checks). For a list of size n, learn the magic numbers — linear search worst case = n checks; binary search worst case ≈ log2(n), so 1,024 items needs only about 10. Quoting the powers of 2 turns a vague 'faster' into a guaranteed mark."
  },

  {
    chapter: 4,
    question: "(a) Convert the denary number −90 into 8-bit two's complement binary. Show your working. (3)<br>(b) State how the most significant bit (MSB) shows that a two's complement number is negative. (1)",
    marks: 4,
    answers: [
      {
        grade: "excellent",
        score: "4 / 4",
        label: "Full marks (4/4)",
        text: "(a) First write +90 in 8-bit binary: 64 + 16 + 8 + 2 = 90, so +90 = 0101 1010 (1). Invert every bit: 1010 0101 (1). Add 1: 1010 0110. So −90 = 1010 0110 (1). Check: −128 + 32 + 4 + 2 = −90 ✓. (b) In two's complement the MSB has a negative place value (−128 in 8 bits), so if the MSB is 1 the number is negative (1).",
        analysis: [
          { type: "tick", text: "All three steps shown in order: positive binary, invert, add 1 — each step is a method mark" },
          { type: "tick", text: "+90 = 0101 1010 is correct (64+16+8+2) — a wrong start would lose the final answer mark" },
          { type: "tick", text: "Self-check using place values (−128 + 32 + 4 + 2 = −90) catches slips and impresses no one but saves marks" },
          { type: "tick", text: "(b) gives the reason — the MSB carries the place value −128 — not just 'it is a 1'" }
        ]
      },
      {
        grade: "medium",
        score: "2 / 4",
        label: "Partial marks (2/4)",
        text: "(a) 90 in binary is 0101 1010 (1). Flip all the bits to get 1010 0101 (1). So −90 = 1010 0101. (b) The number is negative.",
        analysis: [
          { type: "tick", text: "Correct 8-bit binary for +90 — 1 method mark" },
          { type: "tick", text: "Bits inverted correctly — 1 method mark" },
          { type: "cross", text: "Forgot to ADD 1 — the classic two's complement error. 1010 0101 is actually −91, so the answer mark is lost" },
          { type: "cross", text: "(b) restates the question — says nothing about the MSB or its −128 place value" }
        ]
      },
      {
        grade: "weak",
        score: "1 / 4",
        label: "Weak answer (1/4)",
        text: "(a) 90 is 0101 1010 in binary (1). To make it negative you change the first bit to 1, so −90 = 1101 1010. (b) The first bit is the minus sign, like writing − in maths.",
        analysis: [
          { type: "tick", text: "Correct unsigned binary for 90 — 1 mark" },
          { type: "cross", text: "Uses sign-and-magnitude, not two's complement — just setting the MSB gives 1101 1010 = −38, not −90" },
          { type: "cross", text: "No invert step, no add-1 step — the required method is missing entirely" },
          { type: "cross", text: "(b) 'like a minus sign' misses the key idea: the MSB has a NEGATIVE PLACE VALUE of −128" }
        ]
      }
    ],
    examiner_note: "Two's complement is a three-line recipe: (1) write the POSITIVE value in 8 bits, (2) invert every bit, (3) add 1. The add-1 step is the single most forgotten step in the whole paper. Always verify by adding the place values back (−128, 64, 32, 16, 8, 4, 2, 1) — it takes 20 seconds and catches almost every slip. Remember: no calculator in Paper 1, so show every line of working for method marks."
  },

  {
    chapter: 5,
    question: "A bitmap image is 800 pixels wide and 600 pixels high, with a colour depth of 8 bits. (a) Calculate the file size of the image in kilobytes (KB). Show your working. (3)<br>(b) State the effect on the file size of doubling the colour depth to 16 bits. (1)",
    marks: 4,
    answers: [
      {
        grade: "excellent",
        score: "4 / 4",
        label: "Full marks (4/4)",
        text: "(a) Number of pixels = 800 × 600 = 480,000 (1). File size in bits = 480,000 × 8 = 3,840,000 bits (1). Convert to bytes: 3,840,000 ÷ 8 = 480,000 bytes = 480 KB (1). (b) The file size doubles to 960 KB (1).",
        analysis: [
          { type: "tick", text: "Formula applied in clear stages: pixels, then bits, then bytes, then KB — one method mark per stage" },
          { type: "tick", text: "Remembered to divide by 8 to convert bits to bytes — the most commonly lost mark" },
          { type: "tick", text: "Used decimal units as Edexcel requires: 1 KB = 1,000 bytes, so 480,000 B = 480 KB" },
          { type: "tick", text: "(b) quantifies the effect ('doubles to 960 KB') rather than just saying 'bigger'" }
        ]
      },
      {
        grade: "medium",
        score: "2 / 4",
        label: "Partial marks (2/4)",
        text: "(a) 800 × 600 = 480,000 pixels (1). 480,000 × 8 = 3,840,000 (1), so the file is 3,840,000 KB. (b) The file gets bigger.",
        analysis: [
          { type: "tick", text: "Pixel count correct — 1 mark" },
          { type: "tick", text: "Multiplied by colour depth correctly — 1 mark" },
          { type: "cross", text: "3,840,000 is in BITS — the student never divided by 8 for bytes, then slapped 'KB' on the wrong number" },
          { type: "cross", text: "(b) 'gets bigger' is not enough when the relationship is exactly proportional — say it DOUBLES" }
        ]
      },
      {
        grade: "weak",
        score: "1 / 4",
        label: "Weak answer (1/4)",
        text: "(a) 800 × 600 = 480,000 (1), so the file size is 480,000 KB. (b) It would look better quality.",
        analysis: [
          { type: "tick", text: "Pixel count correct — 1 mark" },
          { type: "cross", text: "Colour depth ignored completely — the ×8 step is missing" },
          { type: "cross", text: "Units invented: 480,000 pixels is not 480,000 KB" },
          { type: "cross", text: "(b) answers a different question — the effect asked for is on FILE SIZE, not image quality" }
        ]
      }
    ],
    examiner_note: "Learn the formula as a chain: file size (bits) = width × height × colour depth, then ÷ 8 for bytes, then ÷ 1,000 for KB (Edexcel uses DECIMAL units: 1 KB = 1,000 B, 1 MB = 1,000 KB). Write each line of the chain separately — even if your final answer slips, the method marks survive. The same logic works for sound: sample rate × bit depth × duration."
  },

  {
    chapter: 6,
    question: "(a) Using a Caesar cipher with a key of 3, encrypt the word DOG. (2)<br>(b) A row of 12 pixels in a black-and-white image is: B B B B B B B W W W W B. Write the run-length encoding (RLE) of this row, and state why RLE is a lossless form of compression. (3)",
    marks: 5,
    answers: [
      {
        grade: "excellent",
        score: "5 / 5",
        label: "Full marks (5/5)",
        text: "(a) Shift each letter 3 places forward in the alphabet: D→G, O→R, G→J (1). So DOG encrypts to GRJ (1). (b) The row contains a run of 7 black, then 4 white, then 1 black pixel, so the RLE is 7B 4W 1B (2). RLE is lossless because the original row can be rebuilt exactly from the count-value pairs — no data is permanently discarded (1).",
        analysis: [
          { type: "tick", text: "Cipher method shown letter by letter (D→G, O→R, G→J) — the working earns a mark even if one letter slipped" },
          { type: "tick", text: "RLE counts verified: 7 + 4 + 1 = 12 pixels, matching the row length" },
          { type: "tick", text: "Each run stored as a count-value PAIR — exactly what the mark scheme wants" },
          { type: "tick", text: "Lossless defined by its real meaning: the original can be PERFECTLY reconstructed" }
        ]
      },
      {
        grade: "medium",
        score: "3 / 5",
        label: "Partial marks (3/5)",
        text: "(a) D→G, O→R, G→J, so the ciphertext is GRJ (2). (b) The encoding is 7B 4W (1). It is lossless because the picture stays good quality when you compress it.",
        analysis: [
          { type: "tick", text: "Caesar cipher fully correct with working — 2 marks" },
          { type: "tick", text: "First two runs correct — 1 of the 2 RLE marks" },
          { type: "cross", text: "The final 1B run is missing: 7 + 4 = 11 pixels, but the row has 12. Always check the counts add up" },
          { type: "cross", text: "'Stays good quality' is the LOSSY-vs-lossy-quality argument — lossless means the data can be restored EXACTLY, not 'looks fine'" }
        ]
      },
      {
        grade: "weak",
        score: "1 / 5",
        label: "Weak answer (1/5)",
        text: "(a) DOG becomes EPH because you move each letter along by one. (b) RLE counts up how many of the same pixel there are in a row (1). Lossless means some of the data gets lost but not much.",
        analysis: [
          { type: "cross", text: "Used a key of 1 instead of the key of 3 given in the question — EPH scores nothing" },
          { type: "tick", text: "Knows RLE counts runs of repeated values — 1 mark" },
          { type: "cross", text: "Never actually writes the encoding of THIS row — the question says 'write the RLE'" },
          { type: "cross", text: "Lossless defined as its exact opposite — lossless means NO data is lost" }
        ]
      }
    ],
    examiner_note: "Caesar cipher questions are free marks if you slow down: write out the alphabet, count the shift on your fingers, and use the key GIVEN in the question. For RLE, always check your run counts sum to the row length (7+4+1 = 12 here). And learn the definitions as a pair: lossless = original perfectly restored (RLE, ZIP); lossy = data permanently removed (JPEG, MP3)."
  },

  {
    chapter: 7,
    question: "Describe the fetch-decode-execute cycle carried out by the CPU when running a program.",
    marks: 4,
    answers: [
      {
        grade: "excellent",
        score: "4 / 4",
        label: "Full marks (4/4)",
        text: "The CPU fetches the next instruction from main memory (RAM) (1), using the address held in the program counter, which then increments to point to the following instruction (1). The control unit decodes the instruction to work out what operation is required (1). The instruction is then executed — for example, the ALU carries out a calculation or data is moved — and the cycle repeats for the next instruction, millions of times per second (1).",
        analysis: [
          { type: "tick", text: "All three stages named in the correct order: fetch, decode, execute" },
          { type: "tick", text: "Fetch is technically precise: instruction comes from MAIN MEMORY at the address in the program counter" },
          { type: "tick", text: "Decode tied to the right component — the control unit" },
          { type: "tick", text: "Execute illustrated with the ALU, and the CYCLE (it repeats) is made explicit" }
        ]
      },
      {
        grade: "medium",

let weCurrentFilter = 'all';

function renderChips() {
  const chips = document.getElementById('weChips');
  const chapters = [...new Set(WORKED_EXAMPLES.map(w => w.chapter))].sort((a,b) => a-b);
  chips.innerHTML = `
    <div class="we-chip ${weCurrentFilter === 'all' ? 'active' : ''}" onclick="setWEFilter('all')">All examples</div>
    ${chapters.map(ch => {
      const chMeta = CHAPTERS.find(c => c.id === ch);
      return `<div class="we-chip ${weCurrentFilter === ch ? 'active' : ''}"
                   style="--ch-color:${chMeta?.color || 'var(--blue)'};"
                   onclick="setWEFilter(${ch})">Ch ${ch}: ${chMeta?.title || ''}</div>`;
    }).join('')}
  `;
}

function setWEFilter(filter) {
  weCurrentFilter = filter;
  renderChips();
  renderWorkedExamples();
}

function renderWorkedExamples() {
  const body = document.getElementById('weBody');
  const list = weCurrentFilter === 'all'
    ? WORKED_EXAMPLES
    : WORKED_EXAMPLES.filter(w => w.chapter === weCurrentFilter);

  body.innerHTML = list.map(w => {
    const ch = CHAPTERS.find(c => c.id === w.chapter);
    return `
      <div class="we-question-card" style="--ch-color: ${ch?.color || '#1D4ED8'};">
        <div class="we-question-header">
          <strong style="color: ${ch?.color || '#1D4ED8'}; font-size: 0.85rem;">CHAPTER ${w.chapter} — ${ch?.title || ''}</strong>
          <span class="we-marks">${w.marks} marks</span>
        </div>

        <div class="we-question-text">${w.question}</div>

        ${w.answers.map(a => `
          <div class="we-answer ${a.grade}">
            <div class="we-grade">
              ${a.grade === 'excellent' ? '🏆' : a.grade === 'medium' ? '⚖️' : '❌'}
              ${a.label}
              <span class="we-score-pill">${a.score}</span>
            </div>
            <div class="we-student-text">${a.text}</div>
            <div class="we-marker">
              <div class="we-marker-title">Examiner annotation</div>
              <ul>
                ${a.analysis.map(item => `
                  <li><span class="${item.type}">${item.type === 'tick' ? '✓' : '✕'}</span> ${item.text}</li>
                `).join('')}
              </ul>
            </div>
          </div>
        `).join('')}

        <div class="callout tip" style="margin-top: 1.25rem;">
          <div class="ct-title">👨‍🏫 Examiner takeaway</div>
          <p>${w.examiner_note}</p>
        </div>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  renderChips();
  renderWorkedExamples();
});
</script>
