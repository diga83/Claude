<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaks & Goals — IGCSE ICT 4IT1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
.streak-hero {
  background: linear-gradient(135deg, #DC2626 0%, #B45309 50%, #C2410C 100%);
  color: white;
  padding: 2.5rem;
  border-radius: var(--radius-lg);
  margin-bottom: 1.5rem;
  position: relative;
  overflow: hidden;
}
.streak-hero::before {
  content: '🔥';
  position: absolute;
  right: -2rem; top: -1rem;
  font-size: 14rem;
  opacity: 0.15;
}
.streak-hero h1 {
  font-family: var(--font-display);
  font-size: 2.4rem;
  font-weight: 800;
  margin-bottom: 0.4rem;
  position: relative;
}
.streak-hero .big-number {
  font-family: var(--font-display);
  font-size: 5rem;
  font-weight: 800;
  line-height: 1;
  position: relative;
  margin: 1rem 0 0.5rem;
}
.streak-hero .sub { font-size: 1rem; opacity: 0.92; position: relative; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.4rem;
}
.stat-card .label {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--mid);
  font-weight: 700;
  margin-bottom: 0.6rem;
}
.stat-card .value {
  font-family: var(--font-display);
  font-size: 2.2rem;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
  margin-bottom: 0.3rem;
}
.stat-card .meta { font-size: 0.85rem; color: var(--text-mid); }

.goals-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem 1.75rem;
  margin-bottom: 1.5rem;
}
.goal-row {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 1rem 0;
  border-bottom: 1px dashed var(--border);
}
.goal-row:last-child { border-bottom: none; }
.goal-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 1.5rem;
  flex-shrink: 0;
}
.goal-icon.questions { background: var(--amber-light); color: var(--amber); }
.goal-icon.flashcards { background: var(--teal-light); color: var(--teal); }
.goal-icon.reading { background: var(--blue-light); color: var(--blue); }
.goal-info { flex: 1; }
.goal-name { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; margin-bottom: 0.25rem; }
.goal-progress { font-size: 0.85rem; color: var(--text-mid); }
.goal-bar {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 0.5rem;
}
.goal-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--teal));
  border-radius: 4px;
  transition: width 0.5s ease;
}
.goal-fill.complete { background: linear-gradient(90deg, #DC2626, #B45309); }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 1rem;
}
.calendar-day {
  aspect-ratio: 1;
  background: var(--surface-2);
  border-radius: 4px;
  position: relative;
  display: grid;
  place-items: center;
  font-size: 0.7rem;
  color: var(--mid);
}
.calendar-day.level-1 { background: rgba(34,197,94,0.25); }
.calendar-day.level-2 { background: rgba(34,197,94,0.5); }
.calendar-day.level-3 { background: rgba(34,197,94,0.75); }
.calendar-day.level-4 { background: var(--green); color: white; }
.calendar-day.today { box-shadow: 0 0 0 2px var(--blue); }
.calendar-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  font-size: 0.7rem;
  color: var(--mid);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 0.5rem;
}
.calendar-header div { text-align: center; }

.badges-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.85rem;
}
.badge-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 1.25rem 1rem;
  text-align: center;
  transition: all 0.2s;
}
.badge-card.earned {
  background: linear-gradient(135deg, var(--amber-light), var(--orange-light));
  border-color: var(--amber);
}
[data-theme="dark"] .badge-card.earned {
  background: linear-gradient(135deg, rgba(252,211,77,0.15), rgba(253,186,116,0.15));
}
.badge-card.locked .badge-icon { filter: grayscale(1); opacity: 0.35; }
.badge-icon {
  font-size: 2.5rem;
  margin-bottom: 0.5rem;
  display: block;
  line-height: 1;
}
.badge-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.95rem;
  margin-bottom: 0.25rem;
}
.badge-desc {
  font-size: 0.78rem;
  color: var(--text-mid);
  line-height: 1.4;
}
.badge-card.earned .badge-name { color: var(--amber); }

.goals-config {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 0.85rem;
  margin-top: 1rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
}
.goals-config label { display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.85rem; color: var(--text-mid); }
.goals-config input {
  padding: 0.5rem 0.7rem;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 0.95rem;
  color: var(--text);
  width: 80px;
}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B3A6B">
</head>
<body>

<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main fade-in">
    <div id="streaksContainer"></div>
  </main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/search-index.js"></script>
<script src="assets/js/streaks.js"></script>
<script src="assets/js/app.js"></script>
<script>
function renderStreaks() {
  // Re-evaluate badges every time the page renders, so reading chapters etc.
  // unlocks badges retroactively
  if (typeof evaluateBadges === 'function') evaluateBadges();
  const data = getStreaksData();
  const today = todayKey();
  const todayActivity = data.activityByDay[today] || { questions: 0, flashcards: 0, reading: 0 };

  const questionsTarget = data.goals.questions;
  const flashcardsTarget = data.goals.flashcards;
  const readingTarget = data.goals.reading;

  const qPct = Math.min(100, Math.round((todayActivity.questions / questionsTarget) * 100));
  const fPct = Math.min(100, Math.round((todayActivity.flashcards / flashcardsTarget) * 100));
  const rPct = Math.min(100, Math.round(((todayActivity.reading || 0) / readingTarget) * 100));

  const totalToday = (todayActivity.questions || 0) + (todayActivity.flashcards || 0) +
                     (todayActivity.drills || 0) + (todayActivity.mindmaps || 0);

  // Build last 28 days calendar
  let calendarHtml = '<div class="calendar-header">';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => calendarHtml += `<div>${d}</div>`);
  calendarHtml += '</div><div class="calendar-grid">';

  const days = [];
  for (let i = 27; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  // Align by weekday (Monday-first)
  const firstWeekday = (days[0].getDay() + 6) % 7;
  for (let i = 0; i < firstWeekday; i++) {
    calendarHtml += '<div></div>';
  }
  days.forEach(d => {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const activity = data.activityByDay[key];
    const total = activity ? (activity.questions || 0) + (activity.flashcards || 0) + (activity.drills || 0) : 0;
    let level = 0;
    if (total >= 1) level = 1;
    if (total >= 10) level = 2;
    if (total >= 25) level = 3;
    if (total >= 40) level = 4;
    const isToday = key === today;
    calendarHtml += `<div class="calendar-day level-${level} ${isToday ? 'today' : ''}" title="${d.toDateString()}: ${total} activities">${d.getDate()}</div>`;
  });
  calendarHtml += '</div>';

  const studentFirst = (typeof studentFirstName === 'function') ? studentFirstName() : null;
  const heroTitle = studentFirst ? `🔥 ${studentFirst}'s Streak` : '🔥 Streaks & Goals';
  const isFirstTime = data.totalDays === 0;
  document.getElementById('streaksContainer').innerHTML = `
    <div class="streak-hero">
      <span class="hero-tag">Daily study tracking</span>
      <h1>${heroTitle}</h1>
      <div class="big-number">${data.currentStreak}</div>
      <div class="sub">${data.currentStreak === 0 ? 'Start a streak today!' : data.currentStreak === 1 ? 'day in a row — keep going!' : 'days in a row 🎉'}</div>
    </div>

    ${isFirstTime ? `
      <div style="background: linear-gradient(135deg, var(--blue-light), var(--purple-light)); border: 1px solid var(--blue); border-radius: var(--radius); padding: 1.5rem 1.75rem; margin: 1.5rem 0; text-align:center;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🌱</div>
        <h3 style="font-family: var(--font-display); font-size: 1.25rem; margin-bottom: 0.5rem;">No streak yet — let's start one!</h3>
        <p style="color: var(--text-mid); max-width: 480px; margin: 0 auto 1.25rem;">
          Daily study compounds. Even <strong>10 minutes a day</strong> for 30 days will get you further than cramming for 6 hours the night before. Just hit any of these to start your streak today:
        </p>
        <div style="display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap;">
          <a class="btn btn-primary" href="mcq.html">⚡ Answer 1 MCQ</a>
          <a class="btn" href="flashcards.html">⌬ Review 1 flashcard</a>
          <a class="btn" href="chapters/chapter-1.html">📖 Read a chapter</a>
        </div>
      </div>
    ` : ''}

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Current streak</div>
        <div class="value" style="color:var(--red);">${data.currentStreak}</div>
        <div class="meta">${data.currentStreak === 0 ? 'No active streak' : 'days'}</div>
      </div>
      <div class="stat-card">
        <div class="label">Longest streak</div>
        <div class="value" style="color:var(--amber);">${data.longestStreak}</div>
        <div class="meta">days</div>
      </div>
      <div class="stat-card">
        <div class="label">Total active days</div>
        <div class="value" style="color:var(--blue);">${data.totalDays}</div>
        <div class="meta">since starting</div>
      </div>
      <div class="stat-card">
        <div class="label">Questions answered</div>
        <div class="value" style="color:var(--green);">${data.totalQuestions}</div>
        <div class="meta">all time</div>
      </div>
      <div class="stat-card">
        <div class="label">Cards reviewed</div>
        <div class="value" style="color:var(--teal);">${data.totalFlashcards}</div>
        <div class="meta">all time</div>
      </div>
      <div class="stat-card">
        <div class="label">Badges earned</div>
        <div class="value" style="color:var(--purple);">${data.earnedBadges.length} <span style="font-size:1.2rem; color:var(--mid); font-weight:500;">/ ${BADGES.length}</span></div>
        <div class="meta">achievements</div>
      </div>
    </div>

    <div class="goals-section">
      <h3 style="font-family:var(--font-display); font-size:1.3rem; margin-bottom:0.4rem;">🎯 Today's Goals</h3>
      <p style="color:var(--text-mid); font-size:0.9rem; margin-bottom:1rem;">${totalToday > 0 ? `You've done ${totalToday} activities today.` : "You haven't studied yet today — let's go!"}</p>

      <div class="goal-row">
        <div class="goal-icon questions">?</div>
        <div class="goal-info">
          <div class="goal-name">Practice questions</div>
          <div class="goal-progress">${todayActivity.questions || 0} / ${questionsTarget} answered ${qPct >= 100 ? '✓' : ''}</div>
          <div class="goal-bar"><div class="goal-fill ${qPct >= 100 ? 'complete' : ''}" style="width:${qPct}%"></div></div>
        </div>
        <a class="btn ${qPct >= 100 ? '' : 'btn-primary'}" href="mcq.html">${qPct >= 100 ? 'Done ✓' : 'Practice →'}</a>
      </div>

      <div class="goal-row">
        <div class="goal-icon flashcards">⌬</div>
        <div class="goal-info">
          <div class="goal-name">Flashcards reviewed</div>
          <div class="goal-progress">${todayActivity.flashcards || 0} / ${flashcardsTarget} cards ${fPct >= 100 ? '✓' : ''}</div>
          <div class="goal-bar"><div class="goal-fill ${fPct >= 100 ? 'complete' : ''}" style="width:${fPct}%"></div></div>
        </div>
        <a class="btn ${fPct >= 100 ? '' : 'btn-primary'}" href="flashcards.html">${fPct >= 100 ? 'Done ✓' : 'Review →'}</a>
      </div>

      <div class="goal-row">
        <div class="goal-icon reading">📖</div>
        <div class="goal-info">
          <div class="goal-name">Reading session</div>
          <div class="goal-progress">${todayActivity.reading || 0} / ${readingTarget} ${rPct >= 100 ? '✓' : ''}</div>
          <div class="goal-bar"><div class="goal-fill ${rPct >= 100 ? 'complete' : ''}" style="width:${rPct}%"></div></div>
        </div>
        <a class="btn ${rPct >= 100 ? '' : 'btn-primary'}" href="chapters/chapter-1.html">${rPct >= 100 ? 'Done ✓' : 'Read →'}</a>
      </div>

      <div class="goals-config">
        <label>Daily questions target
          <input type="number" id="goalQuestions" min="1" max="100" value="${data.goals.questions}" onchange="updateGoals()">
        </label>
        <label>Daily flashcards target
          <input type="number" id="goalFlashcards" min="1" max="100" value="${data.goals.flashcards}" onchange="updateGoals()">
        </label>
        <label>Daily reading target
          <input type="number" id="goalReading" min="1" max="10" value="${data.goals.reading}" onchange="updateGoals()">
        </label>
      </div>
    </div>

    <div class="goals-section">
      <h3 style="font-family:var(--font-display); font-size:1.3rem; margin-bottom:0.4rem;">📅 Last 4 Weeks</h3>
      <p style="color:var(--text-mid); font-size:0.9rem; margin-bottom:0.5rem;">Darker = more activity. Hover for details.</p>
      ${calendarHtml}
    </div>

    <h2 class="section-title">🏆 Badges (${data.earnedBadges.length} / ${BADGES.length})</h2>
    <div class="badges-grid">
      ${BADGES.map(b => {
        const earned = data.earnedBadges.includes(b.id);
        return `
          <div class="badge-card ${earned ? 'earned' : 'locked'}">
            <span class="badge-icon">${b.icon}</span>
            <div class="badge-name">${b.name}</div>
            <div class="badge-desc">${b.desc}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div style="margin-top:2rem; padding:1.5rem; background:var(--surface-2); border-radius:12px; text-align:center;">
      <p style="color:var(--text-mid); margin-bottom:0.85rem;">⚠ Need to start over?</p>
      <button class="btn" onclick="resetStreaks()" style="color:var(--red); border-color:var(--red);">↻ Reset all streak data</button>
    </div>

    <details style="margin-top:1.5rem;">
      <summary style="cursor:pointer; padding:0.85rem 1rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; font-size:0.85rem; color:var(--text-mid); user-select:none;">
        🔧 Debug info (click to expand if a badge isn't unlocking)
      </summary>
      <div style="padding:1rem 1.25rem; background:var(--surface); border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; margin-top:-1px; font-family:var(--font-mono); font-size:0.82rem; line-height:1.6;">
        <p style="font-family:var(--font-body); margin-bottom:0.5rem;">If a badge you should have earned isn't showing, click <strong>"Recheck all badges"</strong> below. This forces a re-evaluation against your current totals.</p>
        <button class="btn btn-primary" onclick="recheckBadges()" style="margin-bottom:1rem;">↻ Recheck all badges</button>
        <p style="font-family:var(--font-body); margin-bottom:0.5rem; font-weight:600;">Current totals:</p>
        <div style="background:var(--surface-2); padding:0.85rem 1rem; border-radius:6px; white-space:pre-wrap; word-break:break-word;">${JSON.stringify({
          totalQuestions: data.totalQuestions,
          totalFlashcards: data.totalFlashcards,
          totalDays: data.totalDays,
          currentStreak: data.currentStreak,
          longestStreak: data.longestStreak,
          readChapters: data.readChapters,
          goalsHit: data.goalsHit,
          earnedBadges: data.earnedBadges
        }, null, 2)}</div>
        <p style="font-family:var(--font-body); margin:0.85rem 0 0.4rem; font-weight:600;">Each badge's condition vs your current state:</p>
        <div style="background:var(--surface-2); padding:0.85rem 1rem; border-radius:6px;">
          ${BADGES.map(b => {
            const met = b.condition(data);
            const earned = data.earnedBadges.includes(b.id);
            const icon = earned ? '🏆' : met ? '⚠️' : '·';
            const status = earned ? 'earned' : met ? 'meets condition but NOT earned!' : 'not yet';
            return `<div style="margin:0.25rem 0;">${icon} <strong>${b.id}</strong> (${b.desc}) — ${status}</div>`;
          }).join('')}
        </div>
        <p style="font-family:var(--font-body); margin-top:0.85rem; font-size:0.78rem; color:var(--mid);">
          If a badge shows ⚠️ "meets condition but NOT earned", click "Recheck all badges" above to fix it.
        </p>
      </div>
    </details>
  `;
}

function recheckBadges() {
  if (typeof evaluateBadges === 'function') {
    const data = getStreaksData();
    const before = data.earnedBadges.slice();
    evaluateBadges(data);
    const after = getStreaksData().earnedBadges;
    const newOnes = after.filter(b => !before.includes(b));
    if (newOnes.length > 0) {
      alert(`Unlocked ${newOnes.length} new badge${newOnes.length === 1 ? '' : 's'}: ${newOnes.join(', ')}`);
    } else {
      alert('All applicable badges are already unlocked. If you expected a new badge, you may not yet meet its condition.');
    }
    renderStreaks();
  }
}

function updateGoals() {
  const data = getStreaksData();
  const q = parseInt(document.getElementById('goalQuestions').value, 10) || 20;
  const f = parseInt(document.getElementById('goalFlashcards').value, 10) || 15;
  const r = parseInt(document.getElementById('goalReading').value, 10) || 1;
  data.goals = { questions: q, flashcards: f, reading: r };
  saveStreaksData(data);
  renderStreaks();
}

function resetStreaks() {
  if (!confirm('Reset all streak data, goals, and badges? This cannot be undone.')) return;
  try { localStorage.removeItem(STREAKS_KEY); } catch(e) {}
  location.reload();
}

document.addEventListener('DOMContentLoaded', renderStreaks);
</script>
</body>
</html>
